# Cloud Build configuration for AI Insights Generator
# Deploys Flask app with TypeScript frontend to Google Cloud Run
#
# Trigger this build with:
#   gcloud builds submit --config cloudbuild.yaml
#
# Or set up automatic triggers from GitHub/Cloud Source Repositories

steps:
  # Step 1: Build the Docker image with multi-stage build
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-f'
      - 'Dockerfile.insight'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '--build-arg'
      - 'BUILD_ENV=${_BUILD_ENV}'
      - '.'
    timeout: 1200s

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}'
    waitFor:
      - 'build-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--cpu=${_CPU}'
      - '--memory=${_MEMORY}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIREBASE_PROJECT_ID=$PROJECT_ID,FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com,FIREBASE_STORAGE_BUCKET=$PROJECT_ID.appspot.com'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,SERPER_API_KEY=SERPER_API_KEY:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,FIREBASE_MESSAGING_SENDER_ID=FIREBASE_MESSAGING_SENDER_ID:latest,FIREBASE_APP_ID=FIREBASE_APP_ID:latest,FIREBASE_MEASUREMENT_ID=FIREBASE_MEASUREMENT_ID:latest'
      - '--service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com'
      - '--project=$PROJECT_ID'
    waitFor:
      - 'push-image'

  # Step 4: Verify deployment health
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --format="value(status.url)")

        echo "Service URL: $SERVICE_URL"
        echo "Waiting for service to be ready..."
        sleep 10

        # Test health endpoint
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/status" || echo "000")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Service health check passed"
          echo "Service URL: $SERVICE_URL"
        else
          echo "⚠️  Service health check returned: $HTTP_CODE"
          echo "Service may still be starting up. Check logs:"
          echo "gcloud logging read 'resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${_SERVICE_NAME}\"' --project=$PROJECT_ID --limit=50"
        fi
    waitFor:
      - 'deploy-cloud-run'

# Substitution variables with defaults
substitutions:
  # Image configuration
  _REGION: 'us-west1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _IMAGE_NAME: 'ai-insights-generator'

  # Service configuration
  _SERVICE_NAME: 'ai-insights-generator'
  _SERVICE_ACCOUNT: 'ai-insights-service'

  # Build configuration
  _BUILD_ENV: 'production'

  # Resource configuration
  _CPU: '2'
  _MEMORY: '4Gi'
  _TIMEOUT: '3600'
  _CONCURRENCY: '1000'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'

# Build options
options:
  # Machine type for Cloud Build
  machineType: 'E2_HIGHCPU_8'

  # Disk size for build
  diskSizeGb: 100

  # Logging configuration
  logging: CLOUD_LOGGING_ONLY

  # Timeout for entire build
  timeout: '2400s'

  # Docker configuration
  substitutionOption: 'ALLOW_LOOSE'

  # Dynamic substitutions
  dynamic_substitutions: true

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

# Artifacts to store
artifacts:
  objects:
    location: 'gs://$PROJECT_ID-build-artifacts'
    paths:
      - 'static/dist/**'
      - '.vite/manifest.json'

# Tags for organization
tags:
  - 'ai-insights'
  - 'flask'
  - 'typescript'
  - 'firebase'
  - 'cloud-run'
