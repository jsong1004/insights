# Cloud Build configuration for AI Insights Generator - Development Environment
# Deploys to development Cloud Run service with reduced resources
#
# Trigger this build with:
#   gcloud builds submit --config cloudbuild-dev.yaml

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-f'
      - 'Dockerfile.insight'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:dev-$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:dev-latest'
      - '--build-arg'
      - 'BUILD_ENV=development'
      - '.'
    timeout: 1200s

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}'
    waitFor:
      - 'build-image'

  # Step 3: Deploy to Cloud Run (development service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-insights-generator-dev'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:dev-$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--cpu=1'
      - '--memory=2Gi'
      - '--timeout=1800'
      - '--concurrency=500'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIREBASE_PROJECT_ID=$PROJECT_ID,FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com,FIREBASE_STORAGE_BUCKET=$PROJECT_ID.appspot.com,FLASK_ENV=development'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,SERPER_API_KEY=SERPER_API_KEY:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,FIREBASE_MESSAGING_SENDER_ID=FIREBASE_MESSAGING_SENDER_ID:latest,FIREBASE_APP_ID=FIREBASE_APP_ID:latest,FIREBASE_MEASUREMENT_ID=FIREBASE_MEASUREMENT_ID:latest'
      - '--service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com'
      - '--project=$PROJECT_ID'
    waitFor:
      - 'push-image'

substitutions:
  _REGION: 'us-west1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _IMAGE_NAME: 'ai-insights-generator'
  _SERVICE_ACCOUNT: 'ai-insights-service'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  timeout: '2400s'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:dev-$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:dev-latest'

tags:
  - 'ai-insights'
  - 'development'
  - 'flask'
  - 'typescript'
